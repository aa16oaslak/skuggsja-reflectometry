[project]
name = "hi-skuggsja-reflectometry"
version = "0.1.0"
description = "THz reflectometry rotation-stage and TOptica sweep control with an on-screen emergency stop."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "numpy",
    "libximc>=3,<4",  # tested with 3.0.x; a new major version may change the API
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
reflecto = "hi_skuggsja_reflectometry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hi_skuggsja_reflectometry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
