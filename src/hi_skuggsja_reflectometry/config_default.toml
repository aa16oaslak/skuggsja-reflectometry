# Default configuration for reflecto.
#
# To override selected values, run `reflecto config init` to copy
# this file to ./reflecto.toml, then edit only the keys you need
# to change -- everything else falls back to these defaults.

[stages]
device_uri_large = 'xi-com:\\.\COM3'
device_uri_small = 'xi-com:\\.\COM4'
zero_l = 180.5      # degrees, zero for large rotation stage wrt home
zero_s = -40         # degrees, zero for small rotation stage wrt home
res_large = 0.0072   # degrees per full motor step, large stage
res_small = 0.015    # degrees per full motor step, small stage
angle_min = 30       # degrees, soft limit
angle_max = 180.0    # degrees, soft limit
# Serial numbers of the receiver's and the sample's controllers ('reflecto check'
# shows each port's). Once set, every command checks that each port has the right
# controller before anything moves, so swapped COM ports are caught. 0 = not checked.
serial_large = 0
serial_small = 0

[toptica]
host = "192.0.2.1"  # placeholder -- override in reflecto.toml with the real instrument address
port = 1998
freq_step = 0.05
settle_freq_tol = 0.1
settle_timeout = 10.0
amp_tol = 0.0005
offset_tol = 0.0002
gain_default = 330000
stabilize_tol = 0.01
stabilize_hold = 2.0
stabilize_timeout = 30.0

[scan_defaults]
freq_start = 70
freq_stop = 400
int_time = 3

[view]
# How the live views draw the setup seen from above. Only the drawing:
# nothing here changes which way or how far a stage moves.
# The way the receiver moves away from Tx as its angle grows.
receiver_turns = "clockwise"
# Where Tx is drawn, in degrees counterclockwise from the right:
# 0 right (as in Fig. 1 of arXiv:2407.05512), 90 up, 180 left, 270 down.
# `reflecto position` turns the drawing to match your view and saves both.
tx_direction = 0
